name: Bluesky-Post bei neuer Ausgabe

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'wiesenzeitung_gifhorn/posts/**'
      - 'borkum_kurier/posts/**'
  # Fix 15 (26.09.2026, Borkum-Live-Start): Wattpost-Ausgaben unter
  # borkum_kurier/posts/ — Push-Trigger, Schedule-Zweig, workflow_dispatch
  # und URL/Hashtag-Mapping ergaenzt (analog Fix 14 fuer WZG).
  # Fix 11 (24.09.2026, Betreiber-Wunsch): Schedule fuer WZG-Morgenausgabe.
  # Push-Trigger greift nur bei posts/** — WZG-Ausgaben liegen unter
  # wiesenzeitung_gifhorn/posts/ und triggern nichts. Der Schedule prueft
  # zweimal taeglich, ob die heutige WZG-Morgenausgabe existiert und noch
  # nicht gepostet ist (State-Datei = Anti-Duplikat). GitHub-Cron = UTC.
  schedule:
    # Fix 17 (26.09.2026, Vorfall Morgenausgabe #40): Schedule-Sicherungsnetz
    # deckt ALLE Formate ab — RADAR (4 Slots), WZG, Borkum. Dossier Ukraine am 26.09.2026 auf Betreiber-Anweisung entfernt (keine Reichweite im Russland-Kontext gewuenscht).
    # Jeder Lauf prueft alle heutigen Dateien (State = Anti-Duplikat),
    # spaetere Laeufe heilen fruehere Ausfaelle selbst.
    - cron: '30 4 * * *'  # 06:30 Berlin — Morgenausgaben
    - cron: '0 6 * * *'   # 08:00 Berlin — zweite Chance Morgenausgaben
    - cron: '5 10 * * *'  # 12:05 Berlin — RADAR Mittagsausgabe
    - cron: '35 16 * * *' # 18:35 Berlin — RADAR Abendausgabe
    - cron: '5 21 * * *'  # 23:05 Berlin — RADAR Nachtausgabe
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run: Auth-Test + Log, KEIN echter Post'
        type: boolean
        required: false
        default: true
      post_file:
        description: 'Nachholen: verpasste Ausgabe posten (z. B. posts/2026-09-24-morgens.html). Leer = nur Testpost.'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: read

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Fix 17 (26.09.2026): Hartes Job-Limit — ein haengender Runner darf die
    # Concurrency-Gruppe nicht einfrieren (Blockade-Vorfall 25./26.09.).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Korrektur-Commits ueberspringen
        if: github.event_name == 'push'
        id: guard
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MSG" | grep -qEi '^(fix|korrektur)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Korrektur-Commit erkannt — kein Post."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # Datei-Erkennung (Fix 24.09.2026, Ausgabe-#32-Vorfall):
      # Vorher: git diff HEAD~1 HEAD — bei einem Push mit MEHREREN
      # Commits (Ausgabe, index, feed) zeigt HEAD~1 auf den vorletzten
      # Commit DES PUSH, nicht auf den Zustand vor dem Push. Das Diff
      # war dann leer (Ausgabe #32, 24.09.2026, Run 10 s, kein Post).
      # Jetzt: github.event.before .. github.sha (Zustand vor dem
      # Push), Fallback HEAD~1 falls before fehlt/nicht erreichbar
      # (neuer Branch, Force-Push, flacher Checkout).
      # workflow_dispatch mit post_file: gezieltes Nachholen einer
      # verpassten Ausgabe — mit State-Pruefung (Anti-Duplikat).
      # Fix 3 (Run 7+8): Robuste Aufloesung — der Datum-Schluessel
      # (JJJJ-MM-DD-slot) wird per grep aus der EINGABE extrahiert,
      # egal ob Pfad, volle URL, "post_file ="-Reste, Whitespace oder
      # unsichtbare Zeichen drumherum stehen. Zusaetzlich
      # Diagnose-Ausgabe: was ankam und wozu es aufgeloest wurde.
      # ============================================================
      - name: Neue posts-Dateien bestimmen (nur hinzugefuegte)
        if: (github.event_name == 'push' && steps.guard.outputs.skip == 'false') || (github.event_name == 'workflow_dispatch' && inputs.post_file != '') || github.event_name == 'schedule'
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          POST_FILE: ${{ inputs.post_file }}
        run: |
          mkdir -p social
          touch social/bluesky-state.txt
          # Fix 12 (25.09.2026, Doppelpost Ausgabe #35): Der Checkout steht
          # auf dem Push-SHA. Bei parallel laufenden/queuenden Laeufen
          # (concurrency-Queue, zweite Push-Welle) ist die State-Datei im
          # Checkout VERALTET — eine bereits gepostete Ausgabe wuerde erneut
          # erkannt und doppelt gepostet. Deshalb: aktuellen Stand von
          # origin/main in die Pruefung einbeziehen (ueber Temp-Datei, damit
          # die lokale State-Datei bei Fetch-Fehlern nicht geleert wird).
          git fetch origin main --quiet || true
          if git show origin/main:social/bluesky-state.txt > social/_state.tmp 2>/dev/null; then
            mv social/_state.tmp social/bluesky-state.txt
          else
            rm -f social/_state.tmp
          fi
          NEW_FILES=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Fix 11: Schedule = Morgenausgaben pruefen (heutiges Datum Berlin).
            # Fix 15 (26.09.2026): zusaetzlich Borkum-Morgenausgabe — derselbe
            # Schedule-Zweig prueft BEIDE Ausgaben (State = Anti-Duplikat).
            # Fix 17 (26.09.2026, Vorfall Morgenausgabe #40): Sicherheitsnetz
            # prueft ALLE Formate — RADAR (4 Slots + Vortags-Nachts, da die
            # Nachtausgabe erst gegen Mitternacht erscheint), WZG, Borkum.
            TODAY=$(TZ=Europe/Berlin date +%F)
            YDAY=$(TZ=Europe/Berlin date -d yesterday +%F)
            for f in "posts/${TODAY}-morgens.html" "posts/${TODAY}-mittags.html" "posts/${TODAY}-abends.html" "posts/${TODAY}-nachts.html" "posts/${YDAY}-nachts.html" "wiesenzeitung_gifhorn/posts/${TODAY}-morgens.html" "borkum_kurier/posts/${TODAY}-morgens.html"; do
              echo "Schedule-Lauf: pruefe $f"
              if [ -f "$f" ]; then
                if grep -qxF "$f" social/bluesky-state.txt; then
                  echo "$f heute bereits gepostet — nichts zu tun."
                else
                  NEW_FILES="$NEW_FILES $f"
                  echo "$f gefunden und ungepostet."
                fi
              else
                echo "$f heute noch nicht vorhanden — nichts zu tun (naechster Schedule versucht erneut)."
              fi
            done
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIFF_BASE="$BEFORE"
            if [ -z "$DIFF_BASE" ] || [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD~1"
              echo "Kein event.before — Fallback HEAD~1."
            fi
            if ! git cat-file -e "$DIFF_BASE" 2>/dev/null; then
              DIFF_BASE="HEAD~1"
              echo "event.before nicht im Checkout — Fallback HEAD~1."
            fi
            for f in $(git diff --diff-filter=A --name-only "$DIFF_BASE" "$GITHUB_SHA" -- 'posts/' 'wiesenzeitung_gifhorn/posts/' 'borkum_kurier/posts/'); do
              case "$f" in
                posts/*.html|wiesenzeitung_gifhorn/posts/*.html|borkum_kurier/posts/*.html)
                  if ! grep -qxF "$f" social/bluesky-state.txt; then
                    NEW_FILES="$NEW_FILES $f"
                  fi
                  ;;
              esac
            done
          else
            f="$POST_FILE"
            echo "POST_FILE empfangen (roh, in []): [$f]"
            key=$(printf '%s' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z]+' | head -n 1)
            if [ -n "$key" ]; then
              # Fix 14 (25.09.2026): WZG-Ausgaben via post_file nachholbar.
              case "$f" in
                *wiesenzeitung*|*WZG*)
                  f="wiesenzeitung_gifhorn/posts/$key.html"
                  ;;
                *borkum*|*Borkum*|*wattpost*|*Wattpost*)
                  f="borkum_kurier/posts/$key.html"
                  ;;
                *dossier*|*Dossier*|*ukraine*|*Ukraine*)
                  key_d=$(printf '%s' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1)
                  f="dossier/ukraine/posts/$key_d.html"
                  ;;
                *)
                  f="posts/$key.html"
                  ;;
              esac
            else
              f=$(printf '%s' "$f" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^post_file[[:space:]]*=[[:space:]]*//')
              case "$f" in
                https://radar724.de/posts/*.html) f="posts/${f#https://radar724.de/posts/}" ;;
              esac
              case "$f" in
                posts/*) ;;
                *.html) if [ -f "posts/$f" ]; then f="posts/$f"; fi ;;
              esac
            fi
            echo "Nachholen aufgeloest zu: [$f]"
            case "$f" in
              posts/*.html|wiesenzeitung_gifhorn/posts/*.html|borkum_kurier/posts/*.html)
                if [ ! -f "$f" ]; then
                  echo "ABBRUCH: Datei $f existiert nicht im Repo. Verfuegbare posts-Dateien:" >&2
                  ls -1 posts/ wiesenzeitung_gifhorn/posts/ borkum_kurier/posts/ 2>/dev/null | tail -n 10 >&2
                  exit 1
                fi
                if grep -qxF "$f" social/bluesky-state.txt; then
                  echo "ABBRUCH: $f wurde laut State-Datei bereits gepostet." >&2
                  exit 1
                fi
                NEW_FILES=" $f"
                ;;
              *)
                echo "ABBRUCH: post_file muss eine Ausgaben-Datei sein, z. B. posts/2026-09-24-morgens.html, wiesenzeitung_gifhorn/posts/2026-09-25-morgens.html, borkum_kurier/posts/2026-09-25-morgens.html oder dossier/ukraine/posts/2026-09-25.html." >&2
                exit 1
                ;;
            esac
          fi
          if [ -n "$NEW_FILES" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$NEW_FILES" > social/_new.txt
            echo "Neue Ausgaben:$NEW_FILES"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen (ungeposteten) Ausgaben."
          fi

      # ============================================================
      # Auf Pages-Deploy warten (Roadmap Punkt 48, Betreiber-Fund):
      # Der Post darf erst raus, wenn die Live-Seite erreichbar ist
      # (GitHub Pages braucht Minuten — Post im Sekundenbereich traf
      # bisher auf einen toten Link, siehe Ausgabe #31, 23:41:45).
      #
      # Architekten-Entscheidung (a vs. b): OPTION (b) — bei Timeout
      # sichtbar failen, NICHT blind posten. Begruendung (PM-Tendenz,
      # uebernommen): Ein verpasster Post ist manuell nachholbar
      # (workflow_dispatch mit post_file), ein geposteter toter Link
      # laesst sich nicht "un-klicken" — bei Deploy-Problemen ist die
      # Seite oft laenger weg, dann waere Post UND Vertrauen verloren.
      #
      # Fix 4 (Run 9, Exit-Code 6): bash -e tötete den Schritt bei
      # curl-Transportfehlern sofort — jetzt HTTP 000 + Poll-Loop.
      # Fix 5 (Run 10): curl --retry 5 innerhalb eines Poll-Zyklus.
      # Fix 6 (Run 11/12, 000 auf drei Runnern): Runner lösen
      # radar724.de UND bfi-ai-247.github.io nicht auf (DNS-Problem
      # der Runner, nicht der Domain). HTTP-Checks am Runner sind
      # damit als primaeres Kriterium unbrauchbar.
      #
      # Fix 7 (Run 12, Timeout nach 15 Zyklen): Deploy-Check PRIMAER
      # ueber die GitHub Pages-API (/pages/builds/latest, mit
      # GITHUB_TOKEN, permission pages: read) — umgeht das Runner-
      # Netz komplett. Erfolg, wenn Status "built" UND (Push: Build-
      # Commit == Run-SHA; Dispatch: Status reicht). HTTP-Check nur
      # noch als Zweitmeinung (falls API mal nicht antwortet).
      # Fix 10 (Run 21, Abendausgabe #34): Build-Status "superseded"
      # (durch schnelle Folge-Pushes ersetzt) gilt ebenfalls als deployed.
      # Fix 9 (Run 20, Mittags-Ausgabe #33): SHA-Abgleich gegen
      # den LATEST-Build bricht bei parallelen Pushes — Nachfolge-
      # Commits uebernehmen "latest" in Minuten. Jetzt: Build-LISTE,
      # Erfolg wenn ein Build mit commit == Run-SHA "built" ist.
      # Fix 8 (Run 18, Startup-Failure): Fix 7 hatte im run-Block
      # un-eingeruckte Python-Zeilen (YAML-Block-Scalar kaputt,
      # Workflow lief nicht mal an). Jetzt: JSON-Parsing via jq
      # (einzeilig, runner-vorinstalliert).
      # Zusaetzlich: Timeout jetzt Wallclock ($SECONDS) statt
      # ELAPSED-Zaehler, der nur Schlafzeit zaehlte und den Poll
      # real ~30 statt 15 Minuten laufen liess.
      #
      # Timing-Parameter: Poll-Intervall 60s, Gesamt-Timeout 900s
      # Wallclock (15 Min — GitHub Pages braucht selten laenger).
      # Reihenfolge: Poll -> Post -> State-Commit (unveraendert).
      # Gilt fuer ALLE Pfade: Push-Ausgabenpost, Nachholen (post_file)
      # UND workflow_dispatch-Testpost.
      # ============================================================
      - name: Auf Pages-Deploy warten (Live-Check vor dem Post)
        id: deploy
        if: (github.event_name == 'push' && steps.guard.outputs.skip == 'false' && steps.files.outputs.new == 'true') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f social/_new.txt ]; then
            URLS=$(sed -e 's|^posts/|https://radar724.de/posts/|' -e 's|^wiesenzeitung_gifhorn/|https://radar724.de/wiesenzeitung_gifhorn/|' -e 's|^borkum_kurier/|https://radar724.de/borkum_kurier/|' -e 's|^dossier/|https://radar724.de/dossier/|' social/_new.txt)
          else
            URLS="https://radar724.de"
          fi
          INTERVAL=60
          TIMEOUT=900
          echo "Warte auf Pages-Deploy — primaer Pages-API, sekundaer HTTP: $URLS"
          while [ $SECONDS -lt $TIMEOUT ]; do
            # --- Weg 1: Pages-API (umgeht Runner-DNS-Probleme) ---
            # Fix 9: Build-LISTE statt /latest — parallele Pushes
            # (index/archive/feed/WZG) ueberholen "latest" sonst in
            # Minuten; der Run-SHA-Build ist dann nie mehr "latest".
            API_JSON=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/BFi-AI-247/bfi-ai-247.github.io/pages/builds?per_page=100" || echo '[]')
            MY_BUILD=$(printf '%s' "$API_JSON" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.commit == $sha)] | sort_by(.created_at) | last // empty' 2>/dev/null || true)
            MY_STATUS=$(printf '%s' "$MY_BUILD" | jq -r '.status // empty' 2>/dev/null || true)
            LATEST_STATUS=$(printf '%s' "$API_JSON" | jq -r 'sort_by(.created_at) | last | .status // empty' 2>/dev/null || true)
            echo "Pages-API: Build fuer Run-SHA ${GITHUB_SHA:0:10}: '${MY_STATUS:-kein Eintrag}'; latest Build: '${LATEST_STATUS:-unbekannt}'"
            # Fix 10 (Run 21, Abendausgabe #34): Schnelle Folge-Pushes
            # (index/archive/feed) superseden den Run-SHA-Build, bevor er
            # "built" erreicht — der Inhalt ist aber im Folge-Build live.
            # Superseded gilt daher ebenfalls als deployed.
            # Fix 16 (26.09.2026, Abendausgabe #38): Schnelle Folge-Pushes
            # (index/archive/feed direkt nach dem Post-Commit) koennen den
            # Run-SHA-Build CANCELLEN ("higher priority waiting request")
            # statt nur zu superseden — Status "canceled" heisst: ein
            # Nachfolge-Build (der unseren Commit enthaelt) hat uebernommen.
            # canceled gilt daher ebenfalls als deployed (wie Fix 10).
            if [ "$MY_STATUS" = "built" ] || [ "$MY_STATUS" = "superseded" ] || [ "$MY_STATUS" = "canceled" ] || [ "$MY_STATUS" = "cancelled" ]; then
              echo "Pages-API bestätigt Deploy (Status: $MY_STATUS, Run-SHA-Build) — Post wird freigegeben."
              echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Fix 17 (26.09.2026, Vorfall Morgenausgabe #40, Run 55): Bei sehr
            # schnellen Folge-Pushes (24 s Abstand) bekommt der Run-SHA teils
            # GAR KEINEN eigenen Pages-Build-Eintrag — MY_STATUS bleibt leer,
            # der Lauf rennt in den Timeout. Neu: Ist der neueste GEBaute
            # Commit ein Nachfahre des Run-SHA (git merge-base --is-ancestor),
            # enthaelt der Live-Build unseren Commit — Deploy gilt als ok.
            if [ -z "$MY_STATUS" ] && [ "$LATEST_STATUS" = "built" ]; then
              LATEST_COMMIT=$(printf '%s' "$API_JSON" | jq -r 'sort_by(.created_at) | last | .commit // empty' 2>/dev/null || true)
              if [ -n "$LATEST_COMMIT" ] && git cat-file -e "$LATEST_COMMIT" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$LATEST_COMMIT" 2>/dev/null; then
                echo "Kein eigener Build-Eintrag, aber Live-Build ${LATEST_COMMIT:0:10} enthaelt Run-SHA — Deploy bestaetigt (Fix 17)."
                echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$LATEST_STATUS" = "built" ]; then
              echo "Dispatch: Kein eigener Build-Eintrag, latest Build aber built — Post wird freigegeben."
              echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # --- Weg 2: HTTP-Zweitmeinung (falls API nicht verfuegbar) ---
            ALL_OK=1
            for u in $URLS; do
              CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --retry-all-errors --max-time 20 "$u" || echo 000)
              if [ "$CODE" != "200" ]; then
                FB=$(printf '%s' "$u" | sed 's|https://radar724.de|https://bfi-ai-247.github.io|')
                FBCODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --retry-all-errors --max-time 20 "$FB" || echo 000)
                if [ "$FBCODE" = "200" ]; then
                  echo "Custom Domain am Runner nicht auflösbar (HTTP $CODE), Pages-Deploy aber LIVE unter $FB (HTTP 200) — Deploy gilt als erreichbar."
                else
                  ALL_OK=0
                  echo "HTTP-Check: noch nicht erreichbar (HTTP $CODE, Fallback $FBCODE): $u"
                  break
                fi
              fi
            done
            if [ $ALL_OK -eq 1 ]; then
              echo "SEITE ERREICHBAR nach ${SECONDS}s — Post wird freigegeben."
              echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $INTERVAL
          done
          echo "ZEITUEBERSCHREITUNG: Pages-API lieferte kein built und HTTP-Checks schlugen nach ${TIMEOUT}s fehl ($URLS)." >&2
          echo "KEIN Post erfolgt (toter Link vermieden — Architekten-Entscheidung b)." >&2
          echo "Nachholen: Actions -> 'Bluesky-Post bei neuer Ausgabe' -> Run workflow -> post_file ausfuellen." >&2
          exit 1

      - name: Nach Bluesky posten (neue Ausgaben)
        if: steps.files.outputs.new == 'true' && steps.deploy.outputs.waited != ''
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.request, html

          username = os.environ["BLUESKY_USERNAME"]
          password = os.environ["BLUESKY_APP_PASSWORD"]
          host = "https://bsky.social"

          def api(endpoint, payload, headers=None):
              req = urllib.request.Request(host + endpoint, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json", **(headers or {})})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          session = api("/xrpc/com.atproto.server.createSession", {"identifier": username, "password": password})
          auth = {"Authorization": "Bearer " + session["accessJwt"]}
          did = session["did"]

          with open("social/_new.txt") as f:
              files = f.read().split()

          posted = []
          errors = []
          for fname in files:
              try:
                  with open(fname, encoding="utf-8") as fh:
                      doc = fh.read()
                  m_num = re.search(r"Ausgabe #(\d+)", doc)
                  num = m_num.group(1) if m_num else None
                  if not num and not fname.startswith("dossier/"):
                      import glob
                      num = str(len([p for p in glob.glob("posts/*.html")]))
                  m_h1 = re.search(r"<h1[^>]*>(.*?)</h1>", doc, re.S)
                  headline = re.sub(r"<[^>]+>", "", m_h1.group(1)).strip() if m_h1 else "Neue Ausgabe"
                  headline = html.unescape(headline)
                  # Borkum-Design-Feature (Design_R3, lt-t): Das doppelte T von
                  # "Wattpost" wird in der H1 als SVG-Leuchtturm gerendert — der
                  # Tag-Strip laesst "WAPOST" zurueck (Vorfall Bluesky-Post #2,
                  # Betreiber-Fund "#Wapost" 26.09.). Korrektur nur bei exaktem Fund.
                  headline = headline.replace("WAPOST", "Wattpost")
                  if fname.startswith("wiesenzeitung_gifhorn/"):
                      prefix = "WZG"
                      link = "https://radar724.de/wiesenzeitung_gifhorn/posts/" + os.path.basename(fname)
                  elif fname.startswith("borkum_kurier/"):
                      prefix = "Wattpost Borkum"
                      link = "https://radar724.de/borkum_kurier/posts/" + os.path.basename(fname)
                  elif fname.startswith("dossier/"):
                      prefix = "Dossier Ukraine"
                      link = "https://radar724.de/dossier/ukraine/posts/" + os.path.basename(fname)
                  else:
                      prefix = "RADAR 724"
                      link = "https://radar724.de/posts/" + os.path.basename(fname)
                  # Fix 13 (25.09.2026, Betreiber-Wunsch): WZG-Posts mit #Gifhorn statt
                  # #KI (Lokalbezug schlaegt Generik beim Lokalkanal).
                  if prefix == "WZG":
                      tags = " #Gifhorn #News"
                  elif prefix == "Wattpost Borkum":
                      tags = " #Borkum #News"
                  elif prefix == "Dossier Ukraine":
                      tags = " #Ukraine #News"
                  else:
                      tags = " #KI #News"
                  # Fix 17: Dossier-Ausgaben tragen keine Ausgabe-Nummer — der
                  # Nummer-Fallback zaehlt RADAR-Posts und wuerde schief liegen.
                  if prefix == "Dossier Ukraine":
                      text = "RADAR 724 · Dossier Ukraine: " + headline + " · " + link + tags
                  else:
                      text = prefix + " · Ausgabe #" + num + ": " + headline + " · " + link + tags
                  if len(text) > 296:
                      cut = 296 - len(link) - len(" … · ") - len(tags)
                      headline = headline[:cut] + "…"
                      if prefix == "Dossier Ukraine":
                          text = "RADAR 724 · Dossier Ukraine: " + headline + " · " + link + tags
                      else:
                          text = prefix + " · Ausgabe #" + num + ": " + headline + " · " + link + tags
                  # Facets: Link + Hashtags (Bluesky-Postings brauchen byte-exakte Ranges)
                  facets = []
                  enc = text.encode("utf-8")
                  pos = enc.find(link.encode())
                  if pos >= 0:
                      facets.append({"index": {"byteStart": pos, "byteEnd": pos + len(link.encode())},
                                     "features": [{"$type": "app.bsky.richtext.facet#link", "uri": link}]})
                  for tag in re.finditer(r"#(KI|News|Gifhorn|Borkum|Ukraine)", text):
                      b0 = len(text[:tag.start()].encode("utf-8"))
                      b1 = len(text[:tag.end()].encode("utf-8"))
                      facets.append({"index": {"byteStart": b0, "byteEnd": b1},
                                     "features": [{"$type": "app.bsky.richtext.facet#tag", "tag": tag.group(0)}]})
                  payload = {"repo": did, "collection": "app.bsky.feed.post",
                             "record": {"$type": "app.bsky.feed.post", "createdAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                        "text": text, "facets": facets,
                                        "langs": ["de"]}}
                  ok = False
                  for attempt in range(1, 4):
                      try:
                          api("/xrpc/com.atproto.repo.createRecord", payload, auth)
                          ok = True
                          break
                      except Exception as e:
                          print(f"Versuch {attempt} fuer {fname} fehlgeschlagen: {e}", flush=True)
                          time.sleep(30 * attempt)
                  if ok:
                      print(f"GEPOSTET: Ausgabe #{num} ({fname})", flush=True)
                      posted.append(fname)
                  else:
                      errors.append(f"{fname} (Ausgabe #{num}): alle 3 Versuche fehlgeschlagen")
              except Exception as e:
                  errors.append(f"{fname}: {e}")

          if posted:
              with open("social/bluesky-state.txt", "a") as f:
                  for p in posted:
                      f.write(p + "\n")
          if errors:
              print("FEHLER:", "\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: State-Datei committen
        if: steps.files.outputs.new == 'true' && steps.deploy.outputs.waited != '' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/bluesky-state.txt
          # Fix 12 (25.09.2026): Rebase auf origin/main vor dem Push — ein
          # Parallel-Run hat denselben State-Eintrag evtl. schon committet
          # (identischer Patch wird beim Rebase uebersprungen). Ein Fehl-
          # schlag hier ist NICHT fatal: Der Post ist bereits draussen,
          # der Run darf deshalb nicht rot werden (Vorfall Ausgabe #35).
          git diff --cached --quiet || {
            git commit -m "social: Bluesky-Post-State aktualisiert [no-post]"
            git fetch origin main --quiet
            if ! git rebase origin/main; then
              echo "State-Eintrag vermutlich bereits von Parallel-Run committet — Rebase abgebrochen, kein Konflikt noetig."
              git rebase --abort 2>/dev/null || true
            fi
            git push origin HEAD:main || echo "State-Push nicht noetig oder fehlgeschlagen (Parallel-Run war schneller) — Post ist bereits veroeffentlicht."
          }

      - name: Aufraeumen
        if: always()
        run: rm -f social/_new.txt || true

      - name: Manueller Test (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.post_file == '' && steps.deploy.outputs.waited != ''
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.request

          username = os.environ["BLUESKY_USERNAME"]
          password = os.environ["BLUESKY_APP_PASSWORD"]
          dry_run = os.environ.get("DRY_RUN", "true") != "false"
          host = "https://bsky.social"

          if not username or not password:
              print("FEHLER: Secrets BLUESKY_USERNAME / BLUESKY_APP_PASSWORD sind nicht gesetzt (Repo-Settings → Secrets and variables → Actions).", file=sys.stderr)
              sys.exit(1)

          def api(endpoint, payload, headers=None):
              req = urllib.request.Request(host + endpoint, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json", **(headers or {})})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # 1) Auth-Test mit echten Credentials
          session = api("/xrpc/com.atproto.server.createSession", {"identifier": username, "password": password})
          auth = {"Authorization": "Bearer " + session["accessJwt"]}
          did = session["did"]
          print("AUTH-TEST ERFOLGREICH: Session fuer", username, "erstellt.", flush=True)

          # 2) Test-Post OHNE Ausgabennummer (kollidiert nicht mit Anti-Duplikat/State-Logik)
          link = "https://radar724.de"
          text = "Hello, Welt! RADAR 724 ist jetzt auf Bluesky. " + link + " #KI #News"
          facets = []
          enc = text.encode("utf-8")
          pos = enc.find(link.encode())
          if pos >= 0:
              facets.append({"index": {"byteStart": pos, "byteEnd": pos + len(link.encode())},
                             "features": [{"$type": "app.bsky.richtext.facet#link", "uri": link}]})
          for tag in re.finditer(r"#(KI|News)", text):
              b0 = len(text[:tag.start()].encode("utf-8"))
              b1 = len(text[:tag.end()].encode("utf-8"))
              facets.append({"index": {"byteStart": b0, "byteEnd": b1},
                             "features": [{"$type": "app.bsky.richtext.facet#tag", "tag": tag.group(0)}]})
          payload = {"repo": did, "collection": "app.bsky.feed.post",
                     "record": {"$type": "app.bsky.feed.post",
                                "createdAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                "text": text, "facets": facets, "langs": ["de"]}}

          # 3) Architekten-Entscheidung: manueller Test-Post bleibt BEWUSST ausserhalb
          #    der State-Datei social/bluesky-state.txt (nur Action-Log) — blockiert
          #    kuenftige Ausgaben-Posts nicht, dupliziert auch nichts.
          if dry_run:
              print("DRY-RUN — KEIN Post. Folgender Text wuerde gepostet werden:", flush=True)
              print(text, flush=True)
              print("State-Datei bleibt unveraendert (manueller Test ausserhalb der Ausgaben-Anti-Duplikat-Logik).", flush=True)
          else:
              ok = False
              for attempt in range(1, 4):
                  try:
                      api("/xrpc/com.atproto.repo.createRecord", payload, auth)
                      ok = True
                      break
                  except Exception as e:
                      print(f"Versuch {attempt} fehlgeschlagen: {e}", flush=True)
                      if attempt < 3:
                          time.sleep(30 * attempt)
              if ok:
                  print("TEST-POST GEPOSTET (Hello-World, keine Ausgabennummer, kein State-Eintrag).", flush=True)
              else:
                  print("Alle 3 Versuche fehlgeschlagen.", file=sys.stderr)
                  sys.exit(1)
          PYEOF