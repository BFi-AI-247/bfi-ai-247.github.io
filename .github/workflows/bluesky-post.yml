name: Bluesky-Post bei neuer Ausgabe

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run: Auth-Test + Log, KEIN echter Post'
        type: boolean
        required: false
        default: true
      post_file:
        description: 'Nachholen: verpasste Ausgabe posten (z. B. posts/2026-09-24-morgens.html). Leer = nur Testpost.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Korrektur-Commits ueberspringen
        if: github.event_name == 'push'
        id: guard
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MSG" | grep -qEi '^(fix|korrektur)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Korrektur-Commit erkannt — kein Post."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # Datei-Erkennung (Fix 24.09.2026, Ausgabe-#32-Vorfall):
      # Vorher: git diff HEAD~1 HEAD — bei einem Push mit MEHREREN
      # Commits (Ausgabe, index, feed) zeigt HEAD~1 auf den vorletzten
      # Commit DES PUSH, nicht auf den Zustand vor dem Push. Das Diff
      # war dann leer (Ausgabe #32, 24.09.2026, Run 10 s, kein Post).
      # Jetzt: github.event.before .. github.sha (Zustand vor dem
      # Push), Fallback HEAD~1 falls before fehlt/nicht erreichbar
      # (neuer Branch, Force-Push, flacher Checkout).
      # workflow_dispatch mit post_file: gezieltes Nachholen einer
      # verpassten Ausgabe — mit State-Pruefung (Anti-Duplikat).
      # ============================================================
      - name: Neue posts-Dateien bestimmen (nur hinzugefuegte)
        if: (github.event_name == 'push' && steps.guard.outputs.skip == 'false') || (github.event_name == 'workflow_dispatch' && inputs.post_file != '')
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          POST_FILE: ${{ inputs.post_file }}
        run: |
          mkdir -p social
          touch social/bluesky-state.txt
          NEW_FILES=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIFF_BASE="$BEFORE"
            if [ -z "$DIFF_BASE" ] || [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_BASE="HEAD~1"
              echo "Kein event.before — Fallback HEAD~1."
            fi
            if ! git cat-file -e "$DIFF_BASE" 2>/dev/null; then
              DIFF_BASE="HEAD~1"
              echo "event.before nicht im Checkout — Fallback HEAD~1."
            fi
            for f in $(git diff --diff-filter=A --name-only "$DIFF_BASE" "$GITHUB_SHA" -- 'posts/'); do
              case "$f" in
                posts/*.html)
                  if ! grep -qxF "$f" social/bluesky-state.txt; then
                    NEW_FILES="$NEW_FILES $f"
                  fi
                  ;;
              esac
            done
          else
            f="$POST_FILE"
            case "$f" in
              posts/*.html)
                if [ ! -f "$f" ]; then
                  echo "ABBRUCH: Datei $f existiert nicht im Repo." >&2
                  exit 1
                fi
                if grep -qxF "$f" social/bluesky-state.txt; then
                  echo "ABBRUCH: $f wurde laut State-Datei bereits gepostet." >&2
                  exit 1
                fi
                NEW_FILES=" $f"
                ;;
              *)
                echo "ABBRUCH: post_file muss mit posts/ beginnen und auf .html enden." >&2
                exit 1
                ;;
            esac
          fi
          if [ -n "$NEW_FILES" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$NEW_FILES" > social/_new.txt
            echo "Neue Ausgaben:$NEW_FILES"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen (ungeposteten) Ausgaben."
          fi

      # ============================================================
      # Auf Pages-Deploy warten (Roadmap Punkt 48, Betreiber-Fund):
      # Der Post darf erst raus, wenn die Live-Seite erreichbar ist
      # (GitHub Pages braucht Minuten — Post im Sekundenbereich traf
      # bisher auf einen toten Link, siehe Ausgabe #31, 23:41:45).
      #
      # Architekten-Entscheidung (a vs. b): OPTION (b) — bei Timeout
      # sichtbar failen, NICHT blind posten. Begruendung (PM-Tendenz,
      # uebernommen): Ein verpasster Post ist manuell nachholbar
      # (workflow_dispatch mit post_file), ein geposteter toter Link
      # laesst sich nicht "un-klicken" — bei Deploy-Problemen ist die
      # Seite oft laenger weg, dann waere Post UND Vertrauen verloren.
      #
      # Timing-Parameter: Poll-Intervall 60s, Gesamt-Timeout 900s
      # (15 Min — GitHub Pages braucht selten laenger).
      # Reihenfolge: Poll -> Post -> State-Commit (unveraendert).
      # Gilt fuer ALLE Pfade: Push-Ausgabenpost, Nachholen (post_file)
      # UND workflow_dispatch-Testpost (Polling logisch mit, damit
      # Tests die Logik abdecken).
      # ============================================================
      - name: Auf Pages-Deploy warten (Live-Check vor dem Post)
        id: deploy
        if: (github.event_name == 'push' && steps.guard.outputs.skip == 'false' && steps.files.outputs.new == 'true') || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f social/_new.txt ]; then
            URLS=$(sed 's|^posts/|https://radar724.de/posts/|' social/_new.txt)
          else
            URLS="https://radar724.de"
          fi
          INTERVAL=60
          TIMEOUT=900
          ELAPSED=0
          echo "Warte auf Pages-Deploy — pruefe: $URLS"
          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALL_OK=1
            for u in $URLS; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")
              if [ "$CODE" != "200" ]; then
                ALL_OK=0
                echo "Noch nicht erreichbar (HTTP $CODE): $u"
                break
              fi
            done
            if [ $ALL_OK -eq 1 ]; then
              echo "SEITE ERREICHBAR nach ${ELAPSED}s — Post wird freigegeben."
              echo "waited=$ELAPSED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "ZEITUEBERSCHREITUNG: Live-Seite nach ${TIMEOUT}s nicht erreichbar ($URLS)." >&2
          echo "KEIN Post erfolgt (toter Link vermieden — Architekten-Entscheidung b)." >&2
          echo "Nachholen: Actions -> 'Bluesky-Post bei neuer Ausgabe' -> Run workflow -> post_file ausfuellen." >&2
          exit 1

      - name: Nach Bluesky posten (neue Ausgaben)
        if: steps.files.outputs.new == 'true' && steps.deploy.outputs.waited != ''
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.request, html

          username = os.environ["BLUESKY_USERNAME"]
          password = os.environ["BLUESKY_APP_PASSWORD"]
          host = "https://bsky.social"

          def api(endpoint, payload, headers=None):
              req = urllib.request.Request(host + endpoint, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json", **(headers or {})})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          session = api("/xrpc/com.atproto.server.createSession", {"identifier": username, "password": password})
          auth = {"Authorization": "Bearer " + session["accessJwt"]}
          did = session["did"]

          with open("social/_new.txt") as f:
              files = f.read().split()

          posted = []
          errors = []
          for fname in files:
              try:
                  with open(fname, encoding="utf-8") as fh:
                      doc = fh.read()
                  m_num = re.search(r"Ausgabe #(\d+)", doc)
                  num = m_num.group(1) if m_num else None
                  if not num:
                      import glob
                      num = str(len([p for p in glob.glob("posts/*.html")]))
                  m_h1 = re.search(r"<h1[^>]*>(.*?)</h1>", doc, re.S)
                  headline = re.sub(r"<[^>]+>", "", m_h1.group(1)).strip() if m_h1 else "Neue Ausgabe"
                  headline = html.unescape(headline)
                  link = "https://radar724.de/posts/" + os.path.basename(fname)
                  text = "RADAR 724 · Ausgabe #" + num + ": " + headline + " · " + link + " #KI #News"
                  if len(text) > 296:
                      cut = 296 - len(link) - len(" … · ") - len(" #KI #News")
                      headline = headline[:cut] + "…"
                      text = "RADAR 724 · Ausgabe #" + num + ": " + headline + " · " + link + " #KI #News"
                  # Facets: Link + Hashtags (Bluesky-Postings brauchen byte-exakte Ranges)
                  facets = []
                  enc = text.encode("utf-8")
                  pos = enc.find(link.encode())
                  if pos >= 0:
                      facets.append({"index": {"byteStart": pos, "byteEnd": pos + len(link.encode())},
                                     "features": [{"$type": "app.bsky.richtext.facet#link", "uri": link}]})
                  for tag in re.finditer(r"#(KI|News)", text):
                      b0 = len(text[:tag.start()].encode("utf-8"))
                      b1 = len(text[:tag.end()].encode("utf-8"))
                      facets.append({"index": {"byteStart": b0, "byteEnd": b1},
                                     "features": [{"$type": "app.bsky.richtext.facet#tag", "tag": tag.group(0)}]})
                  payload = {"repo": did, "collection": "app.bsky.feed.post",
                             "record": {"$type": "app.bsky.feed.post", "createdAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                        "text": text, "facets": facets,
                                        "langs": ["de"]}}
                  ok = False
                  for attempt in range(1, 4):
                      try:
                          api("/xrpc/com.atproto.repo.createRecord", payload, auth)
                          ok = True
                          break
                      except Exception as e:
                          print(f"Versuch {attempt} fuer {fname} fehlgeschlagen: {e}", flush=True)
                          time.sleep(30 * attempt)
                  if ok:
                      print(f"GEPOSTET: Ausgabe #{num} ({fname})", flush=True)
                      posted.append(fname)
                  else:
                      errors.append(f"{fname} (Ausgabe #{num}): alle 3 Versuche fehlgeschlagen")
              except Exception as e:
                  errors.append(f"{fname}: {e}")

          if posted:
              with open("social/bluesky-state.txt", "a") as f:
                  for p in posted:
                      f.write(p + "\n")
          if errors:
              print("FEHLER:", "\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: State-Datei committen
        if: steps.files.outputs.new == 'true' && steps.deploy.outputs.waited != '' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/bluesky-state.txt
          git diff --cached --quiet || git commit -m "social: Bluesky-Post-State aktualisiert [no-post]"
          git push

      - name: Aufraeumen
        if: always()
        run: rm -f social/_new.txt || true

      - name: Manueller Test (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.post_file == '' && steps.deploy.outputs.waited != ''
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.request

          username = os.environ["BLUESKY_USERNAME"]
          password = os.environ["BLUESKY_APP_PASSWORD"]
          dry_run = os.environ.get("DRY_RUN", "true") != "false"
          host = "https://bsky.social"

          if not username or not password:
              print("FEHLER: Secrets BLUESKY_USERNAME / BLUESKY_APP_PASSWORD sind nicht gesetzt (Repo-Settings → Secrets and variables → Actions).", file=sys.stderr)
              sys.exit(1)

          def api(endpoint, payload, headers=None):
              req = urllib.request.Request(host + endpoint, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json", **(headers or {})})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # 1) Auth-Test mit echten Credentials
          session = api("/xrpc/com.atproto.server.createSession", {"identifier": username, "password": password})
          auth = {"Authorization": "Bearer " + session["accessJwt"]}
          did = session["did"]
          print("AUTH-TEST ERFOLGREICH: Session fuer", username, "erstellt.", flush=True)

          # 2) Test-Post OHNE Ausgabennummer (kollidiert nicht mit Anti-Duplikat/State-Logik)
          link = "https://radar724.de"
          text = "Hello, Welt! RADAR 724 ist jetzt auf Bluesky. " + link + " #KI #News"
          facets = []
          enc = text.encode("utf-8")
          pos = enc.find(link.encode())
          if pos >= 0:
              facets.append({"index": {"byteStart": pos, "byteEnd": pos + len(link.encode())},
                             "features": [{"$type": "app.bsky.richtext.facet#link", "uri": link}]})
          for tag in re.finditer(r"#(KI|News)", text):
              b0 = len(text[:tag.start()].encode("utf-8"))
              b1 = len(text[:tag.end()].encode("utf-8"))
              facets.append({"index": {"byteStart": b0, "byteEnd": b1},
                             "features": [{"$type": "app.bsky.richtext.facet#tag", "tag": tag.group(0)}]})
          payload = {"repo": did, "collection": "app.bsky.feed.post",
                     "record": {"$type": "app.bsky.feed.post",
                                "createdAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                "text": text, "facets": facets, "langs": ["de"]}}

          # 3) Architekten-Entscheidung: manueller Test-Post bleibt BEWUSST ausserhalb
          #    der State-Datei social/bluesky-state.txt (nur Action-Log) — blockiert
          #    kuenftige Ausgaben-Posts nicht, dupliziert auch nichts.
          if dry_run:
              print("DRY-RUN — KEIN Post. Folgender Text wuerde gepostet werden:", flush=True)
              print(text, flush=True)
              print("State-Datei bleibt unveraendert (manueller Test ausserhalb der Ausgaben-Anti-Duplikat-Logik).", flush=True)
          else:
              ok = False
              for attempt in range(1, 4):
                  try:
                      api("/xrpc/com.atproto.repo.createRecord", payload, auth)
                      ok = True
                      break
                  except Exception as e:
                      print(f"Versuch {attempt} fehlgeschlagen: {e}", flush=True)
                      if attempt < 3:
                          time.sleep(30 * attempt)
              if ok:
                  print("TEST-POST GEPOSTET (Hello-World, keine Ausgabennummer, kein State-Eintrag).", flush=True)
              else:
                  print("Alle 3 Versuche fehlgeschlagen.", file=sys.stderr)
                  sys.exit(1)
          PYEOF
