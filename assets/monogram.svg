<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" role="img" aria-label="Monogramm BFi">
  <style>
    .stop-bg-oben  { stop-color: #f6f7f8; }
    .stop-bg-unten { stop-color: #e1e3e6; }
    .stop-bronze-a { stop-color: #dcb269; }
    .stop-bronze-b { stop-color: #8c6a25; }
    .bfi-fill      { fill: #23262b; opacity: 0.78; }
    .fbi-wm        { fill: #c9cbd0; stroke: #b7bac0; }
    .rahmen-aussen { stroke: #1f242b; stroke-opacity: 0.10; }
    .rahmen-innen  { stroke: #1f242b; stroke-opacity: 0.05; }
    .schatten      { fill: #1f242b; opacity: 0.18; }
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop class="stop-bg-oben" offset="0%" />
      <stop class="stop-bg-unten" offset="100%" />
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop class="stop-bronze-a" offset="0%" />
      <stop class="stop-bronze-b" offset="100%" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>
  <rect width="400" height="306" rx="36" fill="url(#bg)" />
  <rect class="rahmen-aussen" x="10" y="10" width="380" height="286" rx="28" fill="none" stroke-width="1.5" />
  <rect class="rahmen-innen" x="19" y="19" width="362" height="268" rx="22" fill="none" stroke-width="1" />

  <!-- FBI-Wasserzeichen -->
  <g class="fbi-wm" text-anchor="middle" font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" font-weight="900">
    <text x="200" y="182" font-size="140" letter-spacing="15" stroke-width="1.5">FBI</text>
  </g>

  <!-- Schatten: BF (rechtsbündig) + ı-Balken, 7 Einheiten versetzt -->
  <g class="schatten" filter="url(#soft)">
    <text x="301" y="232" font-size="165" text-anchor="end"
          font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" font-weight="900">BF</text>
    <rect x="313" y="146" width="36" height="86" rx="8" />
  </g>

  <!-- Vordergrund: BFi mit punktlosem ı als Balken -->
  <g class="bfi-fill">
    <text x="294" y="225" font-size="165" text-anchor="end"
          font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" font-weight="900">BF</text>
    <rect x="306" y="139" width="36" height="86" rx="8" />
  </g>

  <!-- bronzener i-Punkt, exakt über dem ı-Balken zentriert -->
  <circle cx="324" cy="119" r="13.5" fill="url(#bronze)" />

  <!-- Akzentlinien -->
  <rect x="92" y="49" width="216" height="6" rx="3" fill="url(#bronze)" />
  <rect x="92" y="251" width="216" height="6" rx="3" fill="url(#bronze)" />
</svg>
